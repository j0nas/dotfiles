[tools]
starship = "latest"
zoxide = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"  # JSON parsing for shell scripts (e.g. the Claude Code statusline)
# taplo + check-jsonschema power the repo's pre-commit config validation hook
# (.githooks/pre-commit). taplo schema-checks TOML (starship, mise) and
# check-jsonschema schema-checks JSON (Claude settings) against the
# vendored schemas in .githooks/schemas/. jq above does JSON syntax checks.
taplo = "latest"
# uv: the venv/installer for the pipx: tools below. Without it mise's pipx backend
# falls back to pipx→pip, whose "upgrade shared libraries" step fails now and then.
# brew's uv (.chezmoidata.yaml) is there for another reason: the Fusion MCP's PATH.
uv = "latest"
"pipx:check-jsonschema" = "latest"  # pipx backend; uv (above) provides the venv
shellcheck = "latest"  # lints the repo's shell scripts in the pre-commit hook + CI
# More pre-commit/CI validators (.githooks/validate): jactionlint lints the GitHub
# workflow and shellchecks its run: blocks (mise's registry deprecated actionlint
# in favour of this fork); stylua is used purely as a Lua *parser* — formatting
# the WezTerm config to /dev/null fails only on a syntax error, never on style.
jactionlint = "latest"
stylua = "latest"
# scc: counts code per file (JSON with complexity and generated/minified flags,
# respects .gitignore) for the codebase-audit skill's baselines. Not a registry
# short name, hence the aqua backend; tokei and cloc have no prebuilt macOS arm64
# binary through mise.
"aqua:boyter/scc" = "latest"
# node: managed directly by mise (no separate fnm layer). mise's shell-activation
# hook auto-switches Node per project on cd; idiomatic_version_file_enable_tools
# (see [settings] below) makes it honour .node-version / .nvmrc / package.json
# devEngines the way fnm did out of the box. Loose major "26" tracks the latest
# 26.x — bump here to roll the global default across machines. The npm-backed
# tools above build against this node (mise's npm backend uses mise's own node),
# so it must resolve before them.
node = "26"
# pnpm as a standalone tool. Corepack (the old way to provision pnpm) was
# removed from the Node distribution in v25+, and pnpm now self-manages its
# version from a project's package.json "packageManager" field (pmOnFail:
# download, the default). So this just needs to put *some* pnpm on PATH —
# pnpm then auto-switches to each project's pinned version. Version here is
# irrelevant for that reason; "latest" keeps the baseline current.
pnpm = "latest"
# agent-browser: the browser-automation CLI behind the /agent-browser skill.
# `agent-browser install` must fetch the Chrome for Testing build each CLI
# version expects, so the postinstall hook runs that (and prunes the builds it
# replaces) after every install/upgrade — which is what used to keep it a
# hand-pinned pnpm global that nothing ever bumped. The hook runs under sh with
# the CLI already on PATH, hence plain $HOME.
"npm:agent-browser" = { version = "latest", postinstall = "$HOME/.config/mise/hooks/agent-browser-postinstall.sh" }
# gdtoolkit: gdlint/gdformat/gdparse for GDScript (Godot projects) — static
# analysis + formatting, the agent-friendly substitute for the editor's error
# panel. pipx backend; uv (above) provides the venv.
"pipx:gdtoolkit" = "latest"
# glow: terminal markdown reader (charmbracelet). `glow -p` pages rendered
# markdown, replacing `less` for .md files — see the `md` and `keys` aliases.
glow = "latest"
# go: builds the repo's own CLI tools (tools/, e.g. llm-log) into ~/.local/bin
# on apply, and runs their vet + tests in .githooks/validate. Go is the default
# for new tools here: fast static binaries, no runtime to install per machine.
go = "latest"
# herdr: terminal multiplexer for coding agents (runs inside WezTerm like tmux).
# Shows each Claude Code/Codex pane as working, blocked or idle, and keeps
# sessions alive across detach and reboot.
herdr = "latest"
# chezmoi: the tool that applies this very repo. setup.sh runs the first apply
# through `mise exec`, so this is the only copy and the weekly upgrade moves it.
chezmoi = "latest"

[settings]
# Honour .node-version / .nvmrc / package.json devEngines for per-project Node,
# matching the cd auto-switch fnm gave natively. mise keeps idiomatic version
# files off by default (it prefers its own mise.toml), so without this only a
# mise.toml pin would switch Node.
idiomatic_version_file_enable_tools = ["node"]
# Supply-chain cooldown: every "latest"/loose pin above resolves only to releases
# at least this old, so the weekly `mise upgrade` never lands a version published
# hours ago (the window in which a hijacked npm/pypi release is usually caught and
# yanked). Also filters the npm/pipx backends' transitive deps. mise's default is
# 24h; an exact pin bypasses it, so a real emergency upgrade is still one edit.
minimum_release_age = "7d"
