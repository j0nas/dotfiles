packages:
  darwin:
    brews:
      - age   # decrypts chezmoi-managed secrets via SSH key
      - llmfit  # picks the right local LLM + quant for this machine's hardware
      - uv    # darwin-only: puts `uvx` on the broad system PATH so the Claude-spawned Fusion360 MCP launches (mise's uv shim isn't on PATH in that spawn). The validator's uv is mise-managed — see dot_config/mise/config.toml.
    casks:
      - nikitabobko/tap/aerospace
      - bambu-studio
      - brave-browser
      - calibre  # TEMP: remove once Tora's Kindle (PW1) rescue is done
      - discord
      - epson-print-layout
      - font-jetbrains-mono-nerd-font
      - lm-studio
      - obsidian
      - signal
      - spotify
      - swiftbar  # menu-bar host for the ad-hoc AeroSpace workspace-label indicator
      - visual-studio-code
      - wezterm
      - xtool-studio  # xTool Studio (formerly Creative Space) — design/control for the xTool P2 laser
  windows:
    winget:
      - Apple.iCloud
      - Bambulab.Bambustudio
      - Brave.Brave
      - DEVCOM.JetBrainsMonoNerdFont
      - Discord.Discord
      - Microsoft.VisualStudioCode
      - Obsidian.Obsidian
      - OpenWhisperSystems.Signal
      - Spotify.Spotify
      - wez.wezterm
  linux:
    flatpaks:
      - com.bambulab.BambuStudio
      - com.brave.Browser
      - com.discordapp.Discord
      - com.spotify.Client
      - com.visualstudio.code
      - md.obsidian.Obsidian
      - org.signal.Signal
# Pinned agent-browser CLI version. Installed as a pnpm global (not a mise tool)
# because its post-install `agent-browser install` downloads a matched Chrome for
# Testing binary a version manager can't orchestrate — see
# .chezmoiscripts/run_onchange_install-agent-browser.sh.tmpl, which is keyed on
# this string. Bump it here to roll the CLI forward; the next `chezmoi apply`
# re-installs the pin and re-matches Chrome.
agent_browser_version: "0.31.1"

vscode_extensions:
  - anthropic.claude-code
  - bradlc.vscode-tailwindcss
  - buenon.scratchpads
  - catppuccin.catppuccin-vsc
  # Vite+ IDE integration (viteplus.dev/guide/ide-integration). The Vite+ pack
  # bundles oxc (format/lint via `vp check`) + vitest (`vp test`); all three are
  # listed explicitly so the strict-declarative prune in install-vscode-extensions
  # doesn't uninstall the bundled members as "undeclared" on the next apply.
  - oxc.oxc-vscode
  - vitest.explorer
  - voidzero.vite-plus-extension-pack
