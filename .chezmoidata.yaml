packages:
  brews:
    - age   # decrypts chezmoi-managed secrets via SSH key
    - libusb  # mtg-proxy's own Cameo driver cuts over USB through it
    - llmfit  # picks the right local LLM + quant for this machine's hardware
    - uv  # puts `uvx` on the system PATH for the Fusion360 MCP, which Claude spawns where mise's shims aren't. validate's uv is mise's (dot_config/mise/config.toml).
  casks:
    - nikitabobko/tap/aerospace
    - android-commandlinetools  # the android CLI, and home of the Android SDK: run_onchange_after_setup-android-emulator installs the emulator Touchup's `pnpm devices` runs on (no Android Studio needed)
    - android-platform-tools  # adb/fastboot: talk to the Meta Quest 3 over USB (push GLBs, adb reverse for localhost WebXR, screenshots)
    - bambu-studio
    - brave-browser
    - claude
    - discord
    - epson-print-layout
    - fastmail
    - font-jetbrains-mono-nerd-font
    - godot  # Godot 4.x game engine; cask puts a `godot` CLI shim on PATH (headless runs, script checks)
    - herdr-app  # Herdr: desktop app for running coding agents. Updates itself, and on first launch sets up herdr-core (`hc`), which then updates itself with `hc update`
    - lm-studio
    - notunes  # Apple Music can't be uninstalled (sealed system volume); this kills it on launch and redirects media keys to Spotify
    - obsidian
    - signal
    - spotify
    - swiftbar  # menu-bar host for the ad-hoc AeroSpace workspace-label indicator
    - tailscale-app  # lets the Herdr iPhone app reach this Mac's SSH (Remote Login) away from home. The standalone app can't run a Tailscale SSH server (only the CLI-only tailscaled variant can), so the phone logs in with its key through macOS sshd
    - tinycast  # ⌘-Space launcher replacing Spotlight: free, open source, no account
    - visual-studio-code
    - wezterm
    - xtool-studio  # xTool Studio (formerly Creative Space) — design/control for the xTool P2 laser
# G9 desk (dot_config/g9-desk/README.md). Brews join the Brewfile only where
# the g9_desk flag (.chezmoi.toml.tmpl) is true. Deskflow is not in Homebrew:
# setup.sh installs this exact release and checks the sha256 from its sums.txt.
# Bump version+sha together.
desk_g9:
  brews:
    - m1ddc   # DDC/CI from Apple Silicon (`g9 pc|mac`)
  deskflow_version: "1.27.0"
  deskflow_sha256_macos_arm64: "dd21e79e566314394214906d3338c505d337af536fc580c022ee3fadffad0c97"

vscode_extensions:
  - anthropic.claude-code
  - bradlc.vscode-tailwindcss
  - buenon.scratchpads
  - catppuccin.catppuccin-vsc
  # Vite+ IDE integration (viteplus.dev/guide/ide-integration). The Vite+ pack
  # bundles oxc (format/lint via `vp check`) + vitest (`vp test`); all three are
  # listed explicitly so the strict-declarative prune in install-vscode-extensions
  # doesn't uninstall the bundled members as "undeclared" on the next apply.
  - oxc.oxc-vscode
  - vitest.explorer
  - voidzero.vite-plus-extension-pack
