name: CI
on: [push]
env:
  TOP: 1
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
    env:
      DATABASE_URL: postgres://x
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        working-directory: packages/api
        run: |
          pnpm lint
          pnpm exec tsc \
            --noEmit
      - run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - run: "pnpm run test:e2e"
